name: Actualizar BCRP cada hora y verificar frescura
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: patrimonio-bcrp-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'dinatalediego/patrimonio_en_monedas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/refresh.mjs
      - run: node scripts/health.mjs
