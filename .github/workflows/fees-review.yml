name: Review investment fee freshness
on:
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/fees.json', 'scripts/check-fees.mjs', '.github/workflows/fees-review.yml']
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-fees.mjs
